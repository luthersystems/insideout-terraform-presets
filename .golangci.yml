version: "2"

# Used by the org's shared workflows from luthersystems/.github: the
# Security workflow runs gosec through golangci-lint, and the Quality
# workflow runs golangci-lint with the default linter set
# (docs/security-workflow.md and docs/quality-workflow.md there).
issues:
  # Report every finding. The defaults (max-issues-per-linter: 50,
  # max-same-issues: 3) hide repeats, so a run under-reports and "fix and
  # re-run" never ends. Same setting as luthersystems/svc and elps.
  max-issues-per-linter: 0
  max-same-issues: 0
linters:
  exclusions:
    rules:
      # Tests write fixtures to t.TempDir() (G301, G306, G703), read
      # fixtures and golden files by path (G304), run a terraform binary
      # found on PATH (G204), and use fake secret names and ARNs as fixture
      # data (G101). None of these is reachable outside the test.
      - path: _test\.go
        linters:
          - gosec
        text: "G101|G204|G301|G304|G306|G703"
      # ImportedResource.Attributes is deprecated in favour of Attrs, but
      # this module still reads and writes it as the legacy fallback that
      # consumers rely on. The deprecation note is for those consumers, so
      # the uses here are not findings. Remove this rule with the field
      # (luthersystems/insideout-terraform-presets#921).
      - linters:
          - staticcheck
        text: 'SA1019: \(github\.com/luthersystems/insideout-terraform-presets/pkg/composer/imported\.ImportedResource\)\.Attributes is deprecated'
