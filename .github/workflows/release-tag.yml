name: Release (tag)

# On-demand release cut, dispatched from main by an operator (or an agent the
# operator directed) from the Actions UI or `gh workflow run`.
#
# Why this workflow exists: agent sandboxes cannot push tags or create
# releases, so a library with no release workflow can only be released by a
# person at a terminal. That blocked the Go 1.26.10 (GO-2026-6809) releases on
# 2026-10-21 (luthersystems/buildenv#163). This is the same workflow as
# luthersystems/svc's release-tag.yml, plus two checks that svc leaves to the
# operator, because an agent dispatches it:
#
# - The run must be on main, and its commit must be GitHub's live main, so a
#   stale dispatch cannot tag an older commit.
# - The Terraform Validate workflow (terraform-validate.yml) must have succeeded on a push run
#   for that commit, so a red main is never released.
#
# No workflow in this repo runs on a tag, so the default GITHUB_TOKEN can
# create the tag and release directly. A GITHUB_TOKEN-created tag triggers no
# other workflow; if a tag-triggered workflow is added later, cut releases
# with the Claude App token instead, as luthersystems/lutherauth-sdk-go does.
#
# Leave `version` empty to auto-bump the patch component of the latest
# vMAJOR.MINOR.PATCH tag; pass an explicit version for a minor or major bump,
# or for the first release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag (vMAJOR.MINOR.PATCH). Empty = auto-bump patch of the latest tag."
        type: string
        required: false
        default: ""
      dry_run:
        description: "Print the computed version but do NOT cut the release"
        type: boolean
        default: false

permissions:
  actions: read # read the CI workflow's runs for the release commit
  contents: write # gh release create (creates the tag + release)

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  release:
    name: Cut release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # all tags, for latest-version detection
      - name: Check the commit is live main and CI passed
        env:
          GH_TOKEN: ${{ github.token }}
          CI_WORKFLOW: terraform-validate.yml
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "error: dispatch this workflow on main, not $GITHUB_REF" >&2
            exit 1
          fi
          live=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$live" != "$GITHUB_SHA" ]; then
            echo "error: run commit $GITHUB_SHA is not live main $live; dispatch again" >&2
            exit 1
          fi
          ok=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$CI_WORKFLOW/runs?head_sha=$GITHUB_SHA&event=push&status=success" --jq .total_count)
          if [ "$ok" -lt 1 ]; then
            echo "error: no successful push run of $CI_WORKFLOW for $GITHUB_SHA; wait for main CI to pass" >&2
            exit 1
          fi
          echo "commit $GITHUB_SHA is live main and $CI_WORKFLOW passed"
      - name: Compute and validate version
        id: ver
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          latest=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
          if [ -n "$REQUESTED" ]; then
            version="$REQUESTED"
          elif [ -n "$latest" ]; then
            IFS=. read -r major minor patch <<<"${latest#v}"
            version="v${major}.${minor}.$((patch + 1))"
          else
            echo "error: no existing vMAJOR.MINOR.PATCH tag to bump from; pass an explicit version" >&2
            exit 1
          fi
          echo "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "error: version '$version' is not vMAJOR.MINOR.PATCH" >&2
            exit 1
          }
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "error: tag $version already exists" >&2
            exit 1
          fi
          if [ -n "$latest" ]; then
            newest=$(printf '%s\n%s\n' "$latest" "$version" | sort -V | tail -n1)
            if [ "$newest" != "$version" ] || [ "$version" = "$latest" ]; then
              echo "error: version $version is not strictly newer than latest tag $latest" >&2
              exit 1
            fi
          fi
          echo "computed version: $version (latest existing: ${latest:-none})"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Dry run — print only
        if: ${{ inputs.dry_run }}
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: echo "DRY RUN — would release $VERSION from $GITHUB_SHA; nothing created."
      - name: Cut release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" \
            --title "$VERSION" \
            --target "$GITHUB_SHA" \
            --generate-notes
          echo "released $VERSION at $GITHUB_SHA"
